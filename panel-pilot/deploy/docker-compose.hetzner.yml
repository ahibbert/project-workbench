services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - TZ=Australia/Sydney
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none

  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:stable
    container_name: suwayomi
    restart: unless-stopped
    environment:
      - TZ=Australia/Sydney
      - AUTH_MODE=basic_auth
      - AUTH_USERNAME=${SUWAYOMI_AUTH_USER}
      - AUTH_PASSWORD=${SUWAYOMI_AUTH_PASSWORD}
      - WEB_UI_ENABLED=true
      - DOWNLOAD_AS_CBZ=true
    volumes:
      - ./data/suwayomi/downloads:/home/suwayomi/.local/share/Tachidesk/downloads
      - ./data/suwayomi:/home/suwayomi/.local/share/Tachidesk
    ports:
      - "100.83.22.53:4567:4567"
    depends_on:
      - flaresolverr

  panel-pilot:
    build: ./panel-pilot
    container_name: panel-pilot
    restart: unless-stopped
    environment:
      - TZ=Australia/Sydney
      - PANEL_PILOT_AUTH_USER=${PANEL_PILOT_AUTH_USER}
      - PANEL_PILOT_AUTH_PASSWORD=${PANEL_PILOT_AUTH_PASSWORD}
      - SUWAYOMI_AUTH_USER=${SUWAYOMI_AUTH_USER}
      - SUWAYOMI_AUTH_PASSWORD=${SUWAYOMI_AUTH_PASSWORD}
      - SUWAYOMI_INTERNAL_URL=http://suwayomi:4567
      - PANEL_PILOT_LIBRARY_PATH=/app/data/library.json
      - PANEL_PILOT_REPORTS_PATH=/app/data/panel-reports
    volumes:
      - ./data/panel-pilot:/app/data
    ports:
      - "100.83.22.53:8013:8013"
    depends_on:
      - suwayomi

  caddy:
    image: caddy:2-alpine
    container_name: panel-pilot-caddy
    restart: unless-stopped
    ports:
      - "5.223.93.120:80:80"
      - "5.223.93.120:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    depends_on:
      - panel-pilot
