<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Sign in · Panel Pilot</title>
    <style>
      :root { color-scheme: light; --ink: #202522; --muted: #68716c; --canvas: #fff; --panel: #fff; --line: #d9ddd8; --accent: #9a6a00; --accent-2: #347f80; --danger: #b64d43; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body { margin: 0; display: grid; place-items: center; padding: 1rem; background: var(--canvas); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(26rem, 100%); border: 1px solid var(--line); border-radius: 10px; padding: clamp(1.2rem, 5vw, 2rem); background: var(--panel); box-shadow: 0 18px 50px rgba(35, 42, 37, .12); }
      .kicker { margin: 0 0 .2rem; color: var(--accent); font-size: .75rem; font-weight: 850; text-transform: uppercase; }
      h1 { margin: 0; font-size: 1.65rem; }
      .intro { margin: .55rem 0 1.25rem; color: var(--muted); }
      form { display: grid; gap: .9rem; }
      label { display: grid; gap: .35rem; color: var(--muted); font-size: .84rem; font-weight: 760; }
      input, button { width: 100%; min-height: 2.8rem; border: 1px solid var(--line); border-radius: 8px; padding: .6rem .75rem; font: inherit; }
      input { background: #fff; color: var(--ink); }
      button { margin-top: .2rem; cursor: pointer; border-color: #d5a62e; background: #e7bd52; color: #28200b; font-weight: 800; }
      :focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }
      .error { display: none; margin: 0 0 1rem; color: var(--danger); font-size: .88rem; }
      body[data-error="true"] .error { display: block; }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">Panel Pilot</p>
      <h1>Welcome back</h1>
      <p class="intro">Sign in to open your library and reader.</p>
      <p class="error" role="alert">That username or password was not accepted.</p>
      <form action="/login" method="post">
        <input id="login-next" type="hidden" name="next" value="/">
        <label>
          <span>Username</span>
          <input name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
        </label>
        <label>
          <span>Password</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Sign in</button>
      </form>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      document.body.dataset.error = params.has("error") ? "true" : "false";
      const next = params.get("next");
      document.querySelector("#login-next").value = next && next.startsWith("/") && !next.startsWith("//") ? next : "/";
    </script>
  </body>
</html>
