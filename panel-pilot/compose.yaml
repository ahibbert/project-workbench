services:
  panels:
    image: panels:${PANELS_IMAGE_TAG:-local}
    build:
      context: .
      args:
        PANEL_PILOT_BUILD_ID: ${PANELS_BUILD_ID:-local}
    restart: unless-stopped
    read_only: true
    init: true
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      PANEL_PILOT_BIND_ADDRESS: 0.0.0.0
      PANEL_PILOT_AUTH_USER: ${PANEL_PILOT_AUTH_USER:?set PANEL_PILOT_AUTH_USER in .env}
      PANEL_PILOT_AUTH_PASSWORD: ${PANEL_PILOT_AUTH_PASSWORD:?set PANEL_PILOT_AUTH_PASSWORD in .env}
      PANEL_PILOT_SESSION_SECRET: ${PANEL_PILOT_SESSION_SECRET:?set PANEL_PILOT_SESSION_SECRET in .env}
      PANEL_PILOT_SESSION_MAX_AGE: ${PANEL_PILOT_SESSION_MAX_AGE:-2592000}
      SUWAYOMI_INTERNAL_URL: ${SUWAYOMI_INTERNAL_URL:?set SUWAYOMI_INTERNAL_URL in .env}
      SUWAYOMI_AUTH_USER: ${SUWAYOMI_AUTH_USER:-}
      SUWAYOMI_AUTH_PASSWORD: ${SUWAYOMI_AUTH_PASSWORD:-}
      MANGABAKA_API_KEY: ${MANGABAKA_API_KEY:-}
      PANEL_PILOT_LIBRARYTHING_API_KEY: ${PANEL_PILOT_LIBRARYTHING_API_KEY:-}
      PANEL_PILOT_OPEN_LIBRARY_CONTACT: ${PANEL_PILOT_OPEN_LIBRARY_CONTACT:-}
      PANEL_PILOT_LIBRARY_PATH: /app/data/library.json
      PANEL_PILOT_REPORTS_PATH: /app/data/panel-reports
      PANEL_PILOT_DOWNLOAD_BUFFER_PATH: /app/data/download-buffer.json
      PANEL_PILOT_MANGABAKA_CONFIG_PATH: /app/data/mangabaka-config.json
      PANEL_PILOT_COMIC_RECOMMENDATIONS_CACHE_PATH: /app/data/comic-recommendations-cache.json
      PANEL_PILOT_MANGA_DETECTOR_URL: ${PANEL_PILOT_MANGA_DETECTOR_URL:-}
      PANEL_PILOT_MANGA_DETECTOR_CACHE_VERSION: v3-yolo26n-1024-bubbles-800-inkwell-640
      PANEL_PILOT_MANGA_DETECTOR_CACHE_PATH: /app/data/detector-cache
      BOOKS_ENABLED: ${BOOKS_ENABLED:-false}
      SHELFMARK_BASE_URL: ${SHELFMARK_BASE_URL:-}
      SHELFMARK_API_KEY: ${SHELFMARK_API_KEY:-}
      CWA_OPDS_URL: ${CWA_OPDS_URL:-}
      CWA_USERNAME: ${CWA_USERNAME:-}
      CWA_PASSWORD: ${CWA_PASSWORD:-}
      BOOK_SYNC_INTERVAL_SECONDS: ${BOOK_SYNC_INTERVAL_SECONDS:-300}
      PANEL_PILOT_BOOKS_DB_PATH: /app/data/books.sqlite3
      PANEL_PILOT_BOOK_CACHE_PATH: /app/data/book-cache
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./data/panels:/app/data
    ports:
      - ${PANELS_BIND_ADDRESS:-127.0.0.1}:${PANELS_PORT:-8013}:8013
  manga-detector:
    profiles:
      - manga-detector
    build:
      context: .
      dockerfile: ml/Dockerfile
    restart: unless-stopped
    read_only: true
    init: true
    pids_limit: 512
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      ORT_DISABLE_TELEMETRY: "1"
      MANGA_SCORE_THRESHOLD: ${MANGA_SCORE_THRESHOLD:-0.25}
      MANGA_INPUT_SIZE: ${MANGA_INPUT_SIZE:-1024}
      BUBBLE_SCORE_THRESHOLD: ${BUBBLE_SCORE_THRESHOLD:-0.25}
      BUBBLE_INPUT_SIZE: ${BUBBLE_INPUT_SIZE:-800}
      COMIC_SCORE_THRESHOLD: ${COMIC_SCORE_THRESHOLD:-0.25}
      COMIC_NMS_THRESHOLD: ${COMIC_NMS_THRESHOLD:-0.45}
      COMIC_INPUT_SIZE: ${COMIC_INPUT_SIZE:-640}
  shelfmark:
    profiles:
      - books
    image: ghcr.io/calibrain/shelfmark:v1.4.0
    restart: unless-stopped
    init: true
    environment:
      PUID: ${BOOKS_PUID:-1000}
      PGID: ${BOOKS_PGID:-1000}
      TZ: ${TZ:-Australia/Sydney}
      SHELFMARK_API_KEY: ${SHELFMARK_API_KEY:-}
    volumes:
      - book-ingest:/books
      - shelfmark-config:/config
    ports:
      - 127.0.0.1:${SHELFMARK_PORT:-8084}:8084
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8084/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
  calibre-web-automated:
    profiles:
      - books
    image: ghcr.io/crocodilestick/calibre-web-automated:V4.0.8
    restart: unless-stopped
    environment:
      PUID: ${BOOKS_PUID:-1000}
      PGID: ${BOOKS_PGID:-1000}
      TZ: ${TZ:-Australia/Sydney}
    volumes:
      - cwa-config:/config
      - book-ingest:/cwa-book-ingest
      - cwa-library:/calibre-library
    ports:
      - 127.0.0.1:${CWA_PORT:-8083}:8083
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8083/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  book-ingest:
  shelfmark-config:
  cwa-config:
  cwa-library:
